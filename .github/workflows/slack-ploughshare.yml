name: Slack Ploughshare

on:
  # Scheduled automation - runs weekly
  schedule:
    - cron: '0 1 * * 1'   # Auto-warn: Monday 1 AM UTC
    - cron: '0 9 * * 1'   # Check reactions: Monday 9 AM UTC
    - cron: '0 17 * * 1'  # Auto-archive: Monday 5 PM UTC

  # Allow other workflows to call this one
  workflow_call:
    inputs:
      command:
        description: 'Command to run'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode'
        required: false
        type: boolean
        default: true
      additional_flags:
        description: 'Additional flags (e.g., --force-warnings --limit 100)'
        required: false
        type: string
        default: ''

  # Advanced manual trigger with full control
  workflow_dispatch:
    inputs:
      command:
        description: 'Command to run'
        required: true
        type: choice
        options:
          - auto-warn
          - check-reactions
          - auto-archive
          - warning-report
          - send-warnings
          - send-report
      dry_run:
        description: 'Execution mode'
        required: true
        type: choice
        options:
          - 'Dry Run (test only, no changes)'
          - 'Execute For Real (makes actual changes)'
        default: 'Dry Run (test only, no changes)'
      additional_flags:
        description: 'Additional flags (optional: --force-warnings, --limit N)'
        required: false
        type: string
        default: ''

jobs:
  run-slack-ploughshare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install slack-sdk python-dotenv pyyaml

      - name: Pull latest state from repository
        run: |
          git pull origin main || echo "[INFO] No changes to pull"
          ls -lh state/channel_warnings.json 2>/dev/null && echo "[INFO] Warning tracker found" || echo "[INFO] No warning tracker yet"
          ls -lh state/channel_analysis.* 2>/dev/null && echo "[INFO] Analysis data found" || echo "[INFO] No analysis data yet"

      - name: Determine command to run
        id: determine-command
        run: |
          # Check if called from another workflow (workflow_call or boolean dry_run)
          if [ "${{ github.event_name }}" = "workflow_call" ] || [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
            # Called by another workflow (or advanced manual with boolean dry_run)
            COMMAND="${{ inputs.command }}"
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              DRY_RUN="--for-real"
              MODE="EXECUTE"
            else
              DRY_RUN=""
              MODE="DRY RUN"
            fi
            ADDITIONAL="${{ inputs.additional_flags }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - advanced mode with string dry_run
            COMMAND="${{ inputs.command }}"
            if [[ "${{ inputs.dry_run }}" == *"Execute For Real"* ]]; then
              DRY_RUN="--for-real"
              MODE="EXECUTE"
            else
              DRY_RUN=""
              MODE="DRY RUN"
            fi
            ADDITIONAL="${{ inputs.additional_flags }}"
          else
            # Scheduled trigger - determine based on hour
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "01" ]; then
              COMMAND="auto-warn"
              DRY_RUN="--for-real"
              MODE="EXECUTE"
            elif [ "$HOUR" = "09" ]; then
              COMMAND="check-reactions"
              DRY_RUN=""
              MODE="EXECUTE"
            elif [ "$HOUR" = "17" ]; then
              COMMAND="auto-archive"
              DRY_RUN="--for-real"
              MODE="EXECUTE"
            else
              COMMAND="warning-report"
              DRY_RUN=""
              MODE="VIEW"
            fi
            ADDITIONAL=""
          fi

          echo "command=$COMMAND" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "additional=$ADDITIONAL" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "[$MODE] Running: python slack_channel_analytics.py --$COMMAND $DRY_RUN $ADDITIONAL"

      - name: Configure environment
        run: |
          # Use different tokens for different operations:
          # - Analysis/read operations need USER token (can read all channel history and reactions)
          # - Warning/archive operations need BOT token (has chat:write.public)

          COMMAND="${{ steps.determine-command.outputs.command }}"

          if [[ "$COMMAND" == "full-analysis" ]] || [[ "$COMMAND" == "warning-report" ]] || [[ "$COMMAND" == "check-reactions" ]]; then
            echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_USER_TOKEN }}" > .env
            echo "[INFO] Using USER token for analysis/reactions (can read all channel history)"
          else
            echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}" > .env
            echo "[INFO] Using BOT token for warnings/archive (has chat:write.public)"
          fi

          # Copy config if it doesn't exist
          if [ ! -f "slack_analytics_config.yaml" ]; then
            cp slack_analytics_config.yaml.example slack_analytics_config.yaml
          fi

          mkdir -p logs

      - name: Run Slack Ploughshare
        run: |
          python slack_channel_analytics.py --${{ steps.determine-command.outputs.command }} ${{ steps.determine-command.outputs.dry_run }} ${{ steps.determine-command.outputs.additional }}

      - name: Commit state back to repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add state files
          git add state/ 2>/dev/null || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "[INFO] No state changes to commit"
          else
            git commit -m "Update state from workflow run #${{ github.run_number }}"
            git push origin main
            echo "[INFO] State committed and pushed to repository"
          fi

      - name: Generate summary
        if: always()
        run: |
          echo "## Slack Ploughshare Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Command:** \`${{ steps.determine-command.outputs.command }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** \`${{ steps.determine-command.outputs.mode }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.determine-command.outputs.additional }}" ]; then
            echo "**Additional Flags:** \`${{ steps.determine-command.outputs.additional }}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add warning report if available
          if [ -f "channel_warnings.json" ]; then
            echo "### Warning Tracker Status" >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          from datetime import datetime

          with open('state/channel_warnings.json') as f:
              data = json.load(f)
              channels = data.get('channels', {})
              total = len(channels)
              warned = sum(1 for c in channels.values() if c.get('status') == 'warned')
              saved = sum(1 for c in channels.values() if c.get('status') == 'saved')
              archived = sum(1 for c in channels.values() if c.get('status') == 'archived')

              # Count ready for archive
              now = datetime.now()
              ready = sum(1 for c in channels.values()
                         if c.get('status') == 'warned'
                         and datetime.fromisoformat(c['archive_scheduled_for']) <= now)

              print(f'- **Total tracked:** {total}')
              print(f'- **Currently warned:** {warned}')
              print(f'- **Ready for archive:** {ready}')
              print(f'- **Saved by reactions:** {saved}')
              print(f'- **Already archived:** {archived}')
          " >> $GITHUB_STEP_SUMMARY || echo "No warning data available" >> $GITHUB_STEP_SUMMARY
          fi

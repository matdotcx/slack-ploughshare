name: "Initialize: First Run Setup"

on:
  workflow_dispatch:

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install slack-sdk python-dotenv pyyaml

      - name: Configure environment
        run: |
          echo "SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}" > .env
          mkdir -p logs

      - name: Initialize warning tracker
        run: |
          python3 -c "
          from slack_channel_analytics import WarningTracker
          tracker = WarningTracker()
          print('[INFO] Warning tracker initialized')
          print(f'[INFO] File created: channel_warnings.json')
          "

      - name: Run initial channel analysis
        run: |
          echo "[INFO] Running full channel analysis (all channels)..."
          python slack_channel_analytics.py
          echo "[INFO] Analysis complete - checking files..."
          ls -lh state/channel_*.json state/channel_*.csv 2>/dev/null || echo "[WARNING] Analysis files not found"

      - name: Commit state to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state/

          if git diff --staged --quiet; then
            echo "[INFO] No state changes to commit"
          else
            git commit -m "Initialize workspace state - full channel analysis"
            git push origin main
            echo "[INFO] State committed to repository"
          fi

      - name: Upload warning tracker artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warning-tracker
          path: state/channel_warnings.json
          retention-days: 90
          overwrite: true

      - name: Upload channel analysis artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: channel-analysis
          path: |
            state/channel_analysis.json
            state/channel_analysis.csv
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

      - name: Generate summary
        if: always()
        run: |
          echo "## Initialization Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Warning tracker initialized" >> $GITHUB_STEP_SUMMARY
          echo "✅ Initial channel analysis completed (first 10 channels)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Artifacts uploaded for state persistence" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What was created:" >> $GITHUB_STEP_SUMMARY
          echo "- \`state/channel_warnings.json\` - Warning tracker" >> $GITHUB_STEP_SUMMARY
          echo "- \`state/channel_analysis.json\` - Full channel analysis data" >> $GITHUB_STEP_SUMMARY
          echo "- \`state/channel_analysis.csv\` - Full channel analysis data (CSV)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Run **Test: Dry Run Warnings** to see what would be warned" >> $GITHUB_STEP_SUMMARY
          echo "2. Review the output and adjust configuration if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. When ready, run **Execute: Send Warnings** to start tracking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY

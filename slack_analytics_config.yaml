# Slack Channel Analytics Configuration
# Customise thresholds and behaviour for channel cleanup analysis

analysis:
  # Days of inactivity thresholds for categorising channels
  days_dormant: 380       # Channels inactive for this many days are "dormant" (12+ months)
  days_very_old: 550      # Channels inactive for this many days are "very old" (18 months)

  # Include private channels in analysis (requires groups:read scope)
  include_private_channels: true

automation:
  # Enable/disable automatic operations
  enable_auto_warn: true
  enable_auto_check_reactions: true
  enable_auto_archive: true

  # Weekly schedule (staggered to allow completion)
  # Format: "minute hour day-of-month month day-of-week"
  # Default: Every Monday at different times
  schedule_auto_warn: "0 1 * * 1"           # Monday 1 AM
  schedule_check_reactions: "0 9 * * 1"     # Monday 9 AM
  schedule_auto_archive: "0 17 * * 1"       # Monday 5 PM

  # Alternative schedule examples:
  # "0 1 * * 0"     = Sunday 1 AM
  # "0 1 1 * *"     = First day of month at 1 AM
  # "0 1 1,15 * *"  = 1st and 15th of month at 1 AM

cleanup:
  # Which categories to include in cleanup recommendations
  # Set to true to include in cleanup candidates
  include_very_old: true   # Channels with 180+ days of inactivity
  include_dormant: true    # Channels with 30-180 days of inactivity
  include_never_used: true # Channels with zero messages ever

  # Send warning message before archiving
  send_warning: true
  warning_days_before_archive: 30

  # Default warning message (applies to all categories unless overridden)
  warning_message: |
    This channel has been inactive for a long time and is scheduled for archival in 30 days.

    If this channel is still in use or contains important information, please react with a thumbs up or post a message within 30 days to keep it active.

    Channels without activity will be automatically archived on {archive_date}.

    This is an automated message from Slack Ploughshare workspace cleanup.

  # Optional: Category-specific messages (leave empty to use default)
  warning_message_very_old: |
    WARNING: This channel has been inactive for over 180 days and is scheduled for archival.

    If this channel is still needed, please react with a thumbs up or post a message within 30 days.
    Otherwise it will be automatically archived on {archive_date}.

  warning_message_dormant: |
    NOTICE: This channel has been dormant for 30+ days and is scheduled for archival.

    React with a thumbs up or post a message within 30 days to keep it active.
    Archive date: {archive_date}

  warning_message_never_used: |
    This channel was created but has never been used.

    If you still need it, react with a thumbs up or post a message by {archive_date}.
    Otherwise it will be archived to keep the workspace organized.

  # Reactions that save a channel from archival
  # Users can react with any of these to mark the channel as "keep"
  save_reactions: ["thumbsup", "+1", "white_check_mark"]

output:
  # Report settings
  report_file: "state/channel_analysis.json"

  # CSV export settings
  export_csv: true
  csv_file: "state/channel_analysis.csv"

  # How many top channels to show in summary (0 = show all)
  summary_limit: 15

  # Show member counts in output
  show_member_count: true

  # Show last message date in output
  show_last_message_date: true

reporting:
  # Send analysis report to Slack channel
  send_to_slack: true

  # Slack channel ID or name to send reports to (e.g., "C1234567890" or "#admin-reports")
  # You can find the channel ID by right-clicking a channel > View channel details > scroll down
  slack_channel: "C09SP0TT9GS"

logging:
  # Verbose output
  verbose: false

  # Show rate limit warnings
  show_rate_limits: true

  # Progress updates every N channels
  progress_interval: 50

rate_limiting:
  # Delay between API calls in milliseconds (default: 100ms = 0.1s)
  # Slack allows ~60 requests per minute, so 100ms delay is conservative
  delay_between_requests_ms: 100

  # Enable smart rate limiting (respects Slack's rate limit headers)
  smart_rate_limiting: true

  # Maximum retries on rate limit errors
  max_retries: 5
